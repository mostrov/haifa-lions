<!-- דף ניהול מוגן בסיסמה -->
<section id="admin" class="content-section" style="display:none;">
    <h2>פאנל ניהול - אריות חיפה</h2>
    
    <!-- מסך כניסה -->
    <div id="login-box" style="max-width: 400px; margin: 30px auto; background: #f9f9f9; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <h3>כניסת מנהל</h3>
        <p>נא להזין סיסמת ניהול:</p>
        <input type="password" id="admin-pass-input" placeholder="סיסמה" style="width:100%; padding: 10px; margin-bottom: 10px; border: 1px solid #ccc; border-radius: 4px;">
        <button onclick="checkAdminLogin()" style="width:100%; padding: 10px; background: #004080; color: white; border: none; border-radius: 4px; cursor: pointer;">התחבר</button>
    </div>

    <!-- תוכן הניהול (מוצג רק אחרי התחברות מוצלחת) -->
    <div id="admin-panel-content" style="display:none;">
        <div style="background: #eef2f7; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
            <h3>הוספת מאמר חדש</h3>
            <input type="text" id="new-art-title" placeholder="כותרת המאמר" style="width:100%; padding:8px; margin-bottom:10px;">
            <textarea id="new-art-content" placeholder="תוכן המאמר..." rows="4" style="width:100%; padding:8px; margin-bottom:10px;"></textarea>
            <button onclick="addNewArticle()" style="background:#28a745; color:white; padding:10px 15px; border:none; border-radius:4px; cursor:pointer;">פרסם מאמר</button>
        </div>

        <div style="background: #eef2f7; padding: 20px; border-radius: 8px; margin-bottom: 30px;">
            <h3>הוספת תמונה / סרטון (קישור מיוטיוב/רשת)</h3>
            <select id="new-med-type" style="width:100%; padding:8px; margin-bottom:10px;">
                <option value="video">סרטון (YouTube Embed URL)</option>
                <option value="image">תמונה (קישור ישיר לתמונה)</option>
            </select>
            <input type="text" id="new-med-title" placeholder="כותרת המדיה" style="width:100%; padding:8px; margin-bottom:10px;">
            <input type="text" id="new-med-url" placeholder="כתובת URL (למשל: https://...)" style="width:100%; padding:8px; margin-bottom:10px;">
            <button onclick="addNewMedia()" style="background:#28a745; color:white; padding:10px 15px; border:none; border-radius:4px; cursor:pointer;">הוסף מדיה</button>
        </div>

        <div>
            <h3>ניהול תכנים קיימים ומחיקה</h3>
            <div id="admin-items-list"></div>
        </div>
    </div>
</section>

<script>
let adminPassword = "";

function checkAdminLogin() {
    const passInput = document.getElementById('admin-pass-input').value;
    // בדיקה ראשונית מול השרת ע"י שליחת בקשת בדיקה או שמירת הסיסמה
    adminPassword = passInput;
    
    // נבצע קריאה לבדיקת תקינות עם הסיסמה
    fetch('/api/articles')
        .then(res => res.json())
        .then(data => {
            // אם הגענו לכאן השרת זמין, נציג את פאנל הניהול ונטען את הפריטים למחיקה
            document.getElementById('login-box').style.display = 'none';
            document.getElementById('admin-panel-content').style.display = 'block';
            loadAdminItems();
        })
        .catch(err => alert('שגיאה בחיבור לשרת'));
}

function addNewArticle() {
    const title = document.getElementById('new-art-title').value;
    const content = document.getElementById('new-art-content').value;

    fetch('/api/articles', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content, password: adminPassword })
    })
    .then(res => {
        if (!res.ok) throw new Error('סיסמה שגויה או שגיאה בנתונים');
        return res.json();
    })
    .then(data => {
        alert('המאמר נוסף בהצלחה!');
        document.getElementById('new-art-title').value = '';
        document.getElementById('new-art-content').value = '';
        loadAdminItems();
    })
    .catch(err => alert(err.message));
}

function addNewMedia() {
    const type = document.getElementById('new-med-type').value;
    const title = document.getElementById('new-med-title').value;
    const url = document.getElementById('new-med-url').value;

    fetch('/api/media', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ type, url, title, password: adminPassword })
    })
    .then(res => {
        if (!res.ok) throw new Error('סיסמה שגויה או שגיאה בנתונים');
        return res.json();
    })
    .then(data => {
        alert('המדיה נוספה בהצלחה!');
        document.getElementById('new-med-title').value = '';
        document.getElementById('new-med-url').value = '';
        loadAdminItems();
    })
    .catch(err => alert(err.message));
}

function deleteArticle(id) {
    if (!confirm('האם אתแนוחה שברצונך למחוק מאמר זה?')) return;
    
    fetch(`/api/articles/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword })
    })
    .then(res => {
        if (!res.ok) throw new Error('שגיאה במחיקה או סיסמה שגויה');
        return res.json();
    })
    .then(() => {
        alert('המאמר נמחק');
        loadAdminItems();
    })
    .catch(err => alert(err.message));
}

function deleteMedia(id) {
    if (!confirm('האם את בטוחה שברצונך למחוק פריט מדיה זה?')) return;
    
    fetch(`/api/media/${id}`, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: adminPassword })
    })
    .then(res => {
        if (!res.ok) throw new Error('שגיאה במחיקה או סיסמה שגויה');
        return res.json();
    })
    .then(() => {
        alert('המדיה נמחקה');
        loadAdminItems();
    })
    .catch(err => alert(err.message));
}

function loadAdminItems() {
    const listDiv = document.getElementById('admin-items-list');
    listDiv.innerHTML = '<p>טוען נתונים...</p>';

    Promise.all([
        fetch('/api/articles').then(res => res.json()),
        fetch('/api/media').then(res => res.json())
    ]).then(([articles, mediaItems]) => {
        let html = '<h4>מאמרים קיימים:</h4><ul>';
        articles.forEach(art => {
            html += `<li style="margin-bottom:8px;">${art.title} <button onclick="deleteArticle(${art.id})" style="background:#dc3545; color:white; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; margin-right:10px;">מחק</button></li>`;
        });
        html += '</ul><h4>מדיה קיימת:</h4><ul>';
        mediaItems.forEach(med => {
            html += `<li style="margin-bottom:8px;">[${med.type}] ${med.title} <button onclick="deleteMedia(${med.id})" style="background:#dc3545; color:white; border:none; padding:3px 8px; border-radius:3px; cursor:pointer; margin-right:10px;">מחק</button></li>`;
        });
        html += '</ul>';
        listDiv.innerHTML = html;
    });
}
</script>
